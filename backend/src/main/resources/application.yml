# Valeurs par défaut embarquées dans le JAR (aucun secret ici).
# Tout est surchargé par le fichier externe  ./config/application.yml  (monté dans /app/config en production).

logging:
  level:
    root: INFO
    fr.sanglierlab: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

spring:
  application:
    name: travel-tracker
  datasource:
    url: jdbc:mariadb://192.168.1.40:3316/traveltracker
    username: traveltracker
    password: CHANGE_ME
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # le schéma est géré uniquement par Flyway
    # Pas de hibernate.jdbc.time_zone : toutes les dates-heures de la base sont des LocalDateTime « heure UTC » écrites telles quelles.
    # Avec ce réglage ET une JVM qui n'est pas en UTC (poste de développement en Europe/Paris), Hibernate convertissait une seconde
    # fois (heure d'été comprise) et décalait les heures de 1 ou 2 h. En production la JVM tourne en UTC (-Duser.timezone=UTC).
  flyway:
    enabled: true
  servlet:
    multipart:
      # Upload : les fichiers sont écrits sur disque, pas gardés en mémoire.
      # Garder ces limites >= app.max-video-size (et <= client_max_body_size de nginx).
      max-file-size: 600MB
      max-request-size: 600MB

# Journaux : fichier à rotation quotidienne (jour calendaire, heure UTC), les jours passés compressés en .gz, 30 jours conservés.
# LOG_DIR : dossier des journaux (/data/logs dans Docker, monté depuis le NAS) ; en développement, ./logs.
# Dans Docker, la console ne reçoit que les avertissements et les erreurs (LOGGING_THRESHOLD_CONSOLE=WARN, voir docker-compose.yml) :
# tout le reste, démarrage compris, est dans le fichier.
logging:
  file:
    name: ${LOG_DIR:./logs}/travel-tracker.log
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_DIR:./logs}/travel-tracker.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 1GB     # « %i » est obligatoire dans le motif ; 1 Go = jamais atteint, donc un seul fichier par jour
      max-history: 30
      clean-history-on-start: true

server:
  forward-headers-strategy: native   # IP et protocole réels derrière nginx / HAProxy
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        secure: true                 # mettre false uniquement en développement local (http)
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# app.* : voir AppProperties et docker/config/application.example.yml
