# Valeurs par défaut embarquées dans le JAR (aucun secret ici).
# Tout est surchargé par le fichier externe  ./config/application.yml  (monté dans /app/config en production).

spring:
  application:
    name: travel-tracker
  datasource:
    url: jdbc:mariadb://192.168.1.40:3316/traveltracker
    username: traveltracker
    password: CHANGE_ME
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # le schéma est géré uniquement par Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      # Upload : les fichiers sont écrits sur disque, pas gardés en mémoire.
      # Garder ces limites >= app.max-video-size (et <= client_max_body_size de nginx).
      max-file-size: 600MB
      max-request-size: 600MB

server:
  forward-headers-strategy: native   # IP et protocole réels derrière nginx / HAProxy
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        secure: true                 # mettre false uniquement en développement local (http)
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# app.* : voir AppProperties et docker/config/application.example.yml
app:
  # Comptes admin (autant que nécessaire). Hash bcrypt : voir README.md, section « Mot de passe admin ».
  admins:
    - username: voyageur
      password-hash: '$2a$12$q6QMNBPF2YcB3mTWIpAtBebFgpxYftiF1FrRfBcK7nOtMXQl2DZGu'

  # Token de l'API de positions (GPSLogger). 24 caractères minimum, aléatoire.
  api-token: 'REMPLACER_PAR_UNE_LONGUE_CHAINE_ALEATOIRE'

  media-dir: /data/media          # ne pas changer : correspond au volume Docker
  max-photo-size: 30MB
  max-video-size: 500MB
  page-size: 10                   # galeries par page
  track-gap-hours: 6              # coupure du tracé device au-delà de cet écart
  max-login-failures: 5           # échecs avant blocage de l'IP
  login-lock-duration: 15m
  ffmpeg-path: ffmpeg

# Développement local uniquement (HTTP, sans HTTPS) : décommenter.
