# Configuration nginx COMPLÈTE (copiée dans /etc/nginx/nginx.conf par docker/Dockerfile).
# Le conteneur est en réseau "host" (le port 80 est déjà pris par DSM) : nginx écoute sur 18081 et relaie /api vers 127.0.0.1:18080.
# Il tourne sans root : pas de directive "user", fichiers temporaires dans /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    server_tokens off;

    # Protocole vu par le navigateur (HAProxy envoie X-Forwarded-Proto: https).
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https   https;
        http    http;
    }

    # Robots d'indexation, d'archivage, d'entraînement d'IA ou de collecte : refusés (403) en plus de robots.txt, qui reste lisible.
    # Les aperçus de liens des messageries (WhatsApp, Signal...) ne sont pas concernés.
    map $http_user_agent $blocked_bot {
        default 0;
        ~*(googlebot|google-extended|googleother|bingbot|bingpreview|applebot|duckduckbot|yandex|baiduspider|slurp|sogou|exabot|gptbot|chatgpt-user|oai-searchbot|claudebot|claude-web|anthropic-ai|ccbot|perplexity|bytespider|amazonbot|meta-externalagent|facebookbot|cohere-ai|diffbot|imagesift|omgili|petalbot|semrush|ahrefs|mj12bot|dotbot|dataforseo|blexbot|archive\.org_bot|ia_archiver) 1;
    }

    # Journal d'accès : un fichier par jour (access-AAAA-MM-JJ.log, heure du conteneur = UTC), compressé et purgé par rotate-logs.sh.
    map $time_iso8601 $log_date {
        "~^(?<day>\d{4}-\d{2}-\d{2})" $day;   # guillemets obligatoires : le motif contient des accolades
        default unknown;
    }

    server {
        listen 18081;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # IP réelle du visiteur (HAProxy -> nginx arrive par la passerelle Docker 172.x, ou 127.0.0.1, avec X-Forwarded-For).
        set_real_ip_from 127.0.0.1;
        set_real_ip_from 172.16.0.0/12;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        access_log /data/logs/web/access-$log_date.log;
        open_log_file_cache max=4 inactive=1h min_uses=1 valid=1m;
        error_log /dev/stderr warn;

        # Upload de vidéos : doit rester >= app.max-video-size.
        client_max_body_size 600m;

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;

        # En-têtes communs. Ne pas ajouter d'add_header dans les location : cela masquerait ceux-ci.
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Les tuiles OpenStreetMap exigent un Referer : ne pas passer à "no-referrer".
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; media-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # Sonde du healthcheck Docker : ni journal, ni fichier.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            if ($blocked_bot) { return 403; }
            proxy_hide_header X-Robots-Tag; # l'en-tête est déjà posé ci-dessus : pas de doublon
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            # Uploads : le flux part directement vers l'API, sans tampon disque dans nginx.
            proxy_request_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        # Médias servis directement depuis le volume (lecture seule), avec support des Range pour les vidéos.
        # Les envois en cours (dossier .uploads) ne sont jamais servis.
        location ^~ /media/.uploads/ {
            return 404;
        }

        location /media/ {
            if ($blocked_bot) { return 403; }
            alias /data/media/;
            expires 1y;
        }

        location /assets/ {
            if ($blocked_bot) { return 403; }
            expires 1y;
        }

        location = /index.html {
            expires -1;
        }

        # Fichier de thème : modifiable via le volume Docker, donc jamais mis en cache longtemps.
        location = /theme.css {
            expires -1;
        }

        # robots.txt reste lisible par tous, y compris les robots refusés ailleurs.
        location = /robots.txt {
            expires 1h;
        }

        location / {
            if ($blocked_bot) { return 403; }
            try_files $uri $uri/ /index.html;
        }
    }
}
