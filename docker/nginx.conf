worker_processes auto;
pid /run/nginx/nginx.pid;
events { worker_connections 1024; }

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  map $http_x_forwarded_proto $forwarded_proto {
      default $scheme;
      https   https;
      http    http;
  }

  server {
      listen 18081;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      set_real_ip_from 127.0.0.1;
      real_ip_header X-Forwarded-For;
      real_ip_recursive on;

      client_max_body_size 600m;

      add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; media-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

      location /api/ {
          proxy_pass http://127.0.0.1:8080;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_request_buffering off;
          proxy_read_timeout 900s;
          proxy_send_timeout 900s;
      }

      location /media/ {
          alias /data/media/;
          expires 1y;
      }

      location /assets/ {
          expires 1y;
      }

      location = /index.html {
          expires -1;
      }

      location = /theme.css {
          expires -1;
      }

      location / {
          try_files $uri $uri/ /index.html;
      }
  }
}