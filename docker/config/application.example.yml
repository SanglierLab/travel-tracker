# Copier vers  <TT_BASE_DIR>/config/application.yml  puis adapter. Ne JAMAIS versionner la version remplie.

spring:
  datasource:
    url: jdbc:mariadb://127.0.0.1:3306/traveltracker
    username: traveltracker
    password: CHANGE_ME

app:
  # Comptes admin (autant que nécessaire). Hash bcrypt : voir README.md, section « Mot de passe admin ».
  admins:
    - username: voyageur
      password-hash: '$2y$10$REMPLACER_PAR_UN_HASH_BCRYPT'

  # Token de l'API de positions (GPSLogger). 24 caractères minimum, aléatoire.
  api-token: 'REMPLACER_PAR_UNE_LONGUE_CHAINE_ALEATOIRE'

  media-dir: /data/media          # ne pas changer : correspond au volume Docker
  max-photo-size: 30MB
  max-video-size: 500MB
  page-size: 10                   # galeries par page
  track-gap-hours: 6              # coupure du tracé device au-delà de cet écart
  max-login-failures: 5           # échecs avant blocage de l'IP
  login-lock-duration: 15m
  ffmpeg-path: ffmpeg

# Développement local uniquement (HTTP, sans HTTPS) : décommenter.
