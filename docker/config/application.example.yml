# Copier vers  <TT_BASE_DIR>/config/application.yml  puis adapter. Ne JAMAIS versionner la version remplie.

spring:
  datasource:
    url: jdbc:mariadb://host.docker.internal:3306/traveltracker
    username: traveltracker
    password: CHANGE_ME

app:
  # Comptes admin (autant que nécessaire). Hash bcrypt : voir README.md, section « Mot de passe admin ».
  admins:
    - username: voyageur
      password-hash: '$2y$10$REMPLACER_PAR_UN_HASH_BCRYPT'

  # Token de l'API de positions (GPSLogger). 24 caractères minimum, aléatoire.
  api-token: 'REMPLACER_PAR_UNE_LONGUE_CHAINE_ALEATOIRE'

  media-dir: /data/media          # ne pas changer : correspond au volume Docker
  max-photo-size: 30MB
  max-video-size: 500MB
  page-size: 10                   # éléments (albums + étapes) par page du fil
  upcoming-days: 7                # une étape à venir dans ce nombre de jours (ou moins) est montrée en tête du fil ; 0 : aucune
  track-gap-hours: 6              # coupure du tracé device au-delà de cet écart
  track-max-accuracy-meters: 100  # points du téléphone plus imprécis que cela : ignorés à l'ajout
  max-login-failures: 5           # échecs avant blocage de l'IP
  login-lock-duration: 15m
  ffmpeg-path: ffmpeg
  # track-late-after:             # (facultatif) sans nouvelle position depuis ce délai, le marqueur « dernière position » passe en style « en retard »
  #   device: 10m
  #   adsb: 5m
  #   ais: 20m
  #   garmin: 5m
  # adsb-poll-interval: 30s       # (facultatif) fréquence de récupération des positions du vol suivi
  # ais-poll-interval: 5m         # (facultatif) fréquence de récupération des positions du navire suivi
  # livetrack-poll-interval: 60s  # (facultatif) fréquence de lecture des nouvelles positions de la montre Garmin (LiveTrack)

# Développement local uniquement (HTTP, sans HTTPS) : décommenter.
# server:
#   servlet:
#     session:
#       cookie:
#         secure: false
