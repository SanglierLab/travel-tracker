# Lancer depuis ce dossier :  docker compose --env-file .env up -d --build
#
# Les deux conteneurs utilisent le réseau "host" pour joindre MariaDB sur 127.0.0.1:3306
# (un conteneur en réseau bridge ne voit pas le 127.0.0.1 du NAS).
#   api : 127.0.0.1:18080 (inaccessible depuis le réseau local)
#   web : port 18081      (cible de HAProxy)

name: travel-tracker

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: travel-tracker-api:2.0.0
    container_name: travel-tracker-api
    restart: unless-stopped
    network_mode: host
    # Utilisateur du NAS propriétaire du dossier médias (voir .env).
    user: "${PUID:-1026}:${PGID:-100}"
    environment:
      TZ: UTC
      SERVER_PORT: "18080"
      SERVER_ADDRESS: 127.0.0.1
      JAVA_OPTS: "-Xms256m -Xmx1g -Duser.timezone=UTC"
    mem_limit: 1536m
    volumes:
      - ${TT_BASE_DIR}/config/application.yml:/app/config/application.yml:ro
      - ${TT_BASE_DIR}/media:/data/media
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:18080/api/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: travel-tracker-web:2.0.0
    container_name: travel-tracker-web
    restart: unless-stopped
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    volumes:
      - ${TT_BASE_DIR}/media:/data/media:ro
      # Thème personnalisé (optionnel) : copier frontend/public/theme.css dans ${TT_BASE_DIR}/theme/,
      # puis décommenter la ligne suivante. Le fichier doit exister avant le démarrage.
      # - ${TT_BASE_DIR}/theme/theme.css:/usr/share/nginx/html/theme.css:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18081/"]
      interval: 30s
      timeout: 5s
      retries: 3
