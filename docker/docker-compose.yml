# Lancer depuis ce dossier :  docker compose --env-file .env up -d --build
#
# Un seul conteneur (image unique) : nginx sur le port 18081 (cible de HAProxy) + API Spring Boot sur 127.0.0.1:18080
# (inaccessible depuis le réseau local). Réseau "host" pour joindre MariaDB sur 127.0.0.1:3306
# (un conteneur en réseau bridge ne voit pas le 127.0.0.1 du NAS).

name: travel-tracker

services:
  travel-tracker:
    image: sanglierlab/travel-tracker:2.0.0
    container_name: travel-tracker
    pull_policy: never
    restart: unless-stopped
    network_mode: bridge
    # Utilisateur du NAS propriétaire des dossiers médias et journaux (voir .env).
    user: "app:app"
    ports:
      - "7888:18081"  
    environment:
      TZ: UTC
      SERVER_PORT: "18080"
      SERVER_ADDRESS: 127.0.0.1
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -Duser.timezone=UTC"
      # Journaux dans des fichiers du volume : api/ (backend) et web/ (nginx), un fichier par jour, .gz, 30 jours.
      # La console de Docker ne garde que WARN et ERROR du backend.
      LOG_DIR: /data/logs
      LOGGING_THRESHOLD_CONSOLE: WARN
    mem_limit: 1664m
    volumes:
      - /volume1/docker/travel-tracker/config/application.yml:/app/config/application.yml:ro
      - /volume1/docker/travel-tracker/media:/data/media
      - /volume1/docker/travel-tracker/logs:/data/logs
      # Thème personnalisé (optionnel) : copier frontend/public/theme.css dans ${TT_BASE_DIR}/theme/,
      # puis décommenter la ligne suivante. Le fichier doit exister avant le démarrage.
      # - ${TT_BASE_DIR}/theme/theme.css:/usr/share/nginx/html/theme.css:ro
    logging:    # filet de sécurité : ce que Docker garde de la console (WARN/ERROR)
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
