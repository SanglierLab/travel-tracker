server {
  listen 80;
  server_name _;

  # Aucune indexation (ceinture + bretelles avec la meta robots et robots.txt)
  add_header X-Robots-Tag "noindex, nofollow, noarchive, noimageindex" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  root /usr/share/nginx/html;
  index index.html;

  location /api/   { proxy_pass http://backend:8080; proxy_set_header Host $host;
                     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                     proxy_set_header X-Forwarded-Proto $scheme;
                     client_max_body_size 2g; }
  location /media/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }

  location / { try_files $uri $uri/ /index.html; }
}
